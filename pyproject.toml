[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zelunexo"
version = "1.1.0"
description = "Análise local de arquivos duplicados com histórico SQLite e relatório HTML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
zelunexo = "zelunexo.cli:main"

[tool.setuptools.packages.find]
include = ["zelunexo*"]

[tool.setuptools.package-data]
zelunexo = ["assets/*.css", "assets/*.js"]
