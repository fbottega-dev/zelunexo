[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rastro-arquivos"
version = "1.0.0"
description = "Análise local de arquivos duplicados com histórico SQLite e relatório HTML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rastro = "rastro.cli:main"

[tool.setuptools.packages.find]
include = ["rastro*"]

[tool.setuptools.package-data]
rastro = ["assets/*.css", "assets/*.js"]
