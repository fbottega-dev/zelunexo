name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m compileall -q zelunexo tests
      - name: Create sample files
        run: python -m zelunexo demo ./ci-demo
      - name: Analyze sample files
        run: python -m zelunexo analisar ./ci-demo --banco ./.zelunexo/historico.sqlite3 --html ./ci-relatorio.html
      - name: Read saved history
        run: python -m zelunexo historico --banco ./.zelunexo/historico.sqlite3
      - name: Export saved analysis as HTML
        run: python -m zelunexo exportar 1 --banco ./.zelunexo/historico.sqlite3 --saida ./ci-copia.html
      - name: Export saved analysis as JSON
        run: python -m zelunexo exportar 1 --banco ./.zelunexo/historico.sqlite3 --saida ./ci-copia.json --formato json
      - name: Build installable package
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify isolated package installation
        run: python scripts/check_package.py dist/zelunexo-1.1.0-py3-none-any.whl
      - name: Upload verified package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: zelunexo-1.1.0
          path: dist/*.whl
          if-no-files-found: error
